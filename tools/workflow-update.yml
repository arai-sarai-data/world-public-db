name: Update data

# Every Monday (and on demand): rebuild all data from the public sources, check it, and commit it.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build data (a failed source keeps its previous file)
        run: node scripts/build.mjs all || echo "::warning::some sources failed; previous data kept"
      - name: Check data files
        run: node scripts/check.mjs
      - name: Commit data
        run: |
          git config user.name "world-public-db bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Update data"
          git pull --rebase origin main
          git push
